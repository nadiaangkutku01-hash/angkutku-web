<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login -- Angkutku ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <h1 class="text-xl font-black text-slate-900">Angkutku ERP</h1>
      <p class="text-xs text-slate-400 mt-1">Masuk ke akun kamu</p>
    </div>

    <div id="login-error" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-[11px] p-2.5 rounded-lg mb-4"></div>

    <form id="login-form" class="space-y-3">
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Email</label>
        <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2.5 px-3 text-sm" placeholder="nama@angkutku.internal">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Password</label>
        <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2.5 px-3 text-sm">
      </div>
      <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-2.5 rounded-lg mt-2">Masuk</button>
    </form>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    // Kalau sudah login sebelumnya (sesi masih aktif), langsung lempar ke index.html
    restoreSession().then(function(sudahLogin) {
      if (sudahLogin) window.location.href = 'index.html';
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');

      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const result = await loginUser(email, password);

      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errorBox.textContent = result.error || 'Login gagal, cek email/password.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
