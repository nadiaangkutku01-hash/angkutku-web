<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angkutku ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">

  <div id="app-shell" class="hidden">
    <!-- Header -->
    <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
      <div>
        <span class="font-black text-sm">Angkutku ERP</span>
        <span id="header-user-info" class="text-[10px] text-slate-400 block"></span>
      </div>
      <button onclick="logoutUser()" class="text-[10px] bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg"><i class="fas fa-right-from-bracket mr-1"></i>Keluar</button>
    </div>

    <!-- Menu -->
    <div id="nav-menu" class="bg-white border-b border-slate-200 p-3 flex gap-2 overflow-x-auto"></div>

    <!-- Konten -->
    <div id="content-area" class="p-4"></div>
  </div>

  <div id="loading-screen" class="min-h-screen flex items-center justify-center">
    <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i>
  </div>

  <script src="js/supabase-client.js"></script>
  <script src="js/module-pelanggan.js"></script>
  <script src="js/module-masterdata.js"></script>
  <script src="js/module-jadwal.js"></script>
  <script src="js/module-office.js"></script>
  <script src="js/module-office-spk.js"></script>
  <script src="js/module-office-invoice.js"></script>
  <script>
    // Daftar menu -- cuma yang munculnya sesuai hasPermission(). Modul
    // yang belum dibangun ditandai "(segera)" -- klik gak akan ngapa-
    // ngapain, cuma placeholder buat menunjukkan modul apa saja yang
    // ada di rencana.
    const ALL_MENUS = [
      { key: "DASHBOARD", label: "Dashboard", icon: "fa-chart-pie", ready: false },
      { key: "MASTER_DATA", label: "Master Data", icon: "fa-database", ready: true },
      { key: "OFFICE", label: "Office", icon: "fa-file-invoice", ready: true },
      { key: "JADWAL", label: "Jadwal", icon: "fa-calendar", ready: true },
      { key: "LAPORAN_KEUANGAN", label: "Laporan Keuangan", icon: "fa-coins", ready: false },
    ];

    async function initApp() {
      const sudahLogin = await restoreSession();
      if (!sudahLogin) { window.location.href = 'login.html'; return; }

      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      document.getElementById('header-user-info').textContent =
        window.CURRENT_USER_SESSION.name + ' (' + window.CURRENT_USER_SESSION.role + ')';

      renderMenu();
      switchModule('MASTER_DATA'); // buka Master Data dulu sebagai contoh
    }

    function renderMenu() {
      const menuArea = document.getElementById('nav-menu');
      const visibleMenus = ALL_MENUS.filter(function(m) { return window.hasPermission(m.key); });
      menuArea.innerHTML = visibleMenus.map(function(m) {
        return `<button onclick="switchModule('${m.key}')" class="shrink-0 whitespace-nowrap px-3 py-2 rounded-lg text-xs font-bold ${m.ready ? 'bg-slate-100 hover:bg-slate-200 text-slate-700' : 'bg-slate-50 text-slate-300 cursor-not-allowed'}">
          <i class="fas ${m.icon} mr-1.5"></i>${m.label} ${!m.ready ? '<span class="text-[8px]">(segera)</span>' : ''}
        </button>`;
      }).join('');
    }

    function switchModule(key) {
      const contentArea = document.getElementById('content-area');
      if (key === 'MASTER_DATA') {
        renderMasterDataModule(contentArea);
      } else if (key === 'JADWAL') {
        renderJadwalModule(contentArea);
      } else if (key === 'OFFICE') {
        renderOfficeModule(contentArea);
      } else {
        contentArea.innerHTML = '<div class="p-8 text-center text-slate-400 italic">Modul ini belum dibangun di sistem baru -- masih tersedia di sistem GAS lama.</div>';
      }
    }

    initApp();
  </script>
</body>
</html>
